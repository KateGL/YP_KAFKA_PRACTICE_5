lowercaseOutputName: true
rules:
  # Воркер Connect: задачи коннекторов
  - pattern: kafka.connect<type=connect-worker-metrics, connector=(.+), task=(\d+)><>([a-z-]+)
    name: kafka_connect_worker_task_$3
    labels:
      connector: "$1"
      task: "$2"
  - pattern: kafka.connect<type=connect-worker-metrics><>([a-z-]+)
    name: kafka_connect_worker_$1
  # Перебалансировки
  - pattern: kafka.connect<type=connect-worker-rebalance-metrics><>([a-z-]+)
    name: kafka_connect_rebalance_$1
  # Метрики Debezium: свежесть потока, снапшот, очередь
  - pattern: debezium.metrics<type=(connector|streaming|snapshot).metrics, connector=(.+), task=(\d+), server=(.+)><>([a-z-]+)
    name: debezium_$1_$5
    labels:
      connector: "$2"
      task: "$3"
      server: "$4"
